name: Build Android APK (Local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './Melnote/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > ./Melnote/android-keystore.jks
          else
            echo "Keystore secret not provided, continuing without it."
          fi

      - name: Install dependencies
        working-directory: ./Melnote
        run: npm ci

      - name: Build APK locally
        working-directory: ./Melnote
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: eas build --platform android --profile preview --local --non-interactive --output ./build/melnote.apk

      - name: Collect R8 mapping file
        shell: bash
        run: |
          build_dir="${{ runner.temp }}/eas-local-build/build"
          mapping_file="$build_dir/android/app/build/outputs/mapping/release/mapping.txt"

          if [ ! -f "$mapping_file" ] && [ -d "$build_dir" ]; then
            mapping_file="$(find "$build_dir" -type f -path '*/outputs/mapping/release/mapping.txt' -print -quit || true)"
          fi

          if [ -z "$mapping_file" ]; then
            echo "::error::R8 mapping.txt was not generated in the EAS local build directory."
            find "$build_dir" -type f -path '*mapping*' -print 2>/dev/null | head -50 || true
            exit 1
          fi

          cp "$mapping_file" ./Melnote/build/mapping.txt
          echo "Collected R8 mapping file from: $mapping_file"

      - name: Securely Delete Keystore
        if: always()
        run: rm -f ./Melnote/android-keystore.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melnote-apk
          path: |
            ./Melnote/build/melnote.apk
            ./Melnote/build/mapping.txt
          if-no-files-found: error
          retention-days: 7
